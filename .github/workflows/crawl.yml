name: Crawl race + news sources

on:
  schedule:
    - cron: "0 20 * * *" # 03:00 Vietnam time (UTC+7)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 30 (was 15): the gear pipeline's 2026-11-12 per-product detail (PDP)
    # enrichment adds up to MAX_DETAIL_FETCHES_PER_SOURCE (120) extra,
    # rate-limited (2.5s/host) requests per source on a cold cache - a
    # from-scratch run across all four gear sources alone can approach
    # ~20 minutes, on top of the races/news steps. The 7-day detail cache
    # means this is a worst-case budget for a cold cache, not every run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Crawl races
        id: races
        continue-on-error: true
        run: python -m pipeline.main

      - name: Crawl news
        id: news
        continue-on-error: true
        run: python -m pipeline.news_main

      - name: Crawl gear
        id: gear
        continue-on-error: true
        run: python -m pipeline.gear_main

      - name: Commit and push docs/ if changed
        if: always()
        run: |
          git config user.name "race-bot"
          git config user.email "race-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || (git commit -m "races+news: $(date -u +%F)" && git push)

      - name: Fail job if either crawl failed
        if: always()
        run: |
          if [ "${{ steps.races.outcome }}" != "success" ] || [ "${{ steps.news.outcome }}" != "success" ] || [ "${{ steps.gear.outcome }}" != "success" ]; then
            echo "races: ${{ steps.races.outcome }}, news: ${{ steps.news.outcome }}, gear: ${{ steps.gear.outcome }}"
            exit 1
          fi
